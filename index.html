<style>
:root{
  --navy:#0A2A5E; --navy2:#06183A; --accent:#0A2A5E; --accent2:#123B82;
  --ball:#FFD700;
  --bg:#f5f7fa; --card:#ffffff; --text:#16233a; --muted:#5c6b83; --line:#e3e8f0;
  --ok:#1e8e5a; --warn:#b8860b;
  font-family: 'Segoe UI', Roboto, Arial, sans-serif;
}
*{box-sizing:border-box;}
html,body{margin:0;overflow-x:hidden;width:100%;}
body{background:var(--bg) radial-gradient(circle at 20% 0%,#ffffff 0,transparent 60%);color:var(--text);-webkit-tap-highlight-color:transparent;}
header{background:linear-gradient(120deg,var(--navy),var(--navy2));
  color:#fff;padding:14px 16px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;
  border-bottom:4px solid #fff;box-shadow:0 2px 0 var(--ball)}
header .brand{display:flex;flex-direction:column;min-width:0}
header .brand b{font-size:19px}
header .brand b .ball{display:inline-block;animation:bounce 1.4s ease-in-out infinite}
@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
header .brand small{color:#cfe0f5;opacity:.85;font-size:12px}
header .who{font-size:12px;color:#cfe0f5;text-align:right}
nav{display:flex;flex-wrap:wrap;gap:4px;background:#fff;border-bottom:1px solid var(--line);padding:6px 10px;width:100%}
nav button{background:none;border:none;padding:11px 14px;font-size:14px;color:var(--muted);cursor:pointer;border-bottom:3px solid transparent;border-radius:6px;min-height:44px;transition:background .15s,color .15s}
nav button.active{color:var(--navy);border-bottom-color:var(--accent);font-weight:600}
nav button:hover:not(:disabled){background:#f1f5fb;color:var(--navy)}
nav button:disabled{opacity:.4;cursor:not-allowed}
main{max-width:960px;margin:0 auto;padding:16px;width:100%}
.card{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--ball);border-radius:10px;padding:16px;margin-bottom:14px;box-shadow:0 1px 3px rgba(20,30,50,.05);max-width:100%}
h2{margin-top:0;color:var(--navy);font-size:18px}
h3{color:var(--navy);font-size:15px;margin:14px 0 6px}
label{display:block;font-size:13px;color:var(--muted);margin:10px 0 4px}
label.inline{display:flex;align-items:center;gap:6px;margin:6px 0;font-size:14px;color:var(--text)}
label.inline input{width:auto}
input,select,textarea{width:100%;padding:11px 10px;border:1px solid var(--line);border-radius:6px;font-size:16px;background:#fff;font-family:inherit}
input[type=checkbox],input[type=radio]{width:auto}
button.btn{background:var(--accent);color:#fff;border:none;padding:12px 16px;border-radius:6px;cursor:pointer;font-weight:600;font-size:14px;min-height:44px;transition:background .15s,transform .05s;}
button.btn:hover{background:var(--accent2)}
button.btn:active{transform:scale(.98)}
button.btn.ghost{background:#fff;color:var(--navy);border:1px solid var(--navy)}
button.btn.ghost:hover{background:var(--navy);color:#fff}
button.btn.danger{background:#fff;color:var(--warn);border:1px solid var(--warn)}
button.btn.danger:hover{background:var(--warn);color:#fff}
button.btn:disabled{opacity:.5;cursor:not-allowed}
a.btn{display:inline-block;background:#25D366;color:#fff;border:none;padding:12px 16px;border-radius:6px;cursor:pointer;font-weight:600;font-size:14px;min-height:44px;line-height:20px;transition:background .15s;text-decoration:none;text-align:center}
a.btn:hover{background:#1ebe5a}
.help-fab{display:inline-flex;align-items:center;justify-content:center;width:34px;height:34px;border-radius:50%;background:#25D366;color:#fff;font-size:18px;text-decoration:none;box-shadow:0 1px 4px rgba(0,0,0,.3);transition:background .15s,transform .1s}
.help-fab:hover{background:#1ebe5a;transform:scale(1.08)}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row>*{flex:1;min-width:160px}
.badge{display:inline-block;padding:2px 9px;border-radius:20px;font-size:12px;font-weight:600}
.badge.ok{background:#e3f6ec;color:var(--ok)}
.badge.warn{background:#fdecec;color:var(--warn)}
.badge.muted{background:#eef1f5;color:var(--muted)}
.muted{color:var(--muted);font-size:13px}
.table-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:0 -4px;padding:0 4px}
.player-item{border:1px solid var(--line);border-radius:8px;padding:8px 10px;margin-bottom:6px}
.player-item-head{margin-bottom:4px;font-size:14px}
.player-item-meta{display:flex;flex-wrap:wrap;gap:8px;font-size:12px;color:var(--muted);margin-top:3px}
.player-item .row{gap:6px;margin-top:6px}
.player-item .row>*{flex:0 0 auto;min-width:0}
.collapsible-header{cursor:pointer;user-select:none;margin-bottom:0}
.collapsible-header:hover{color:var(--accent2)}
.collapsible-body{margin-top:12px}
.admin-card{padding:12px 14px}
.admin-card button.btn{padding:6px 12px;min-height:34px;font-size:13px}
table{width:100%;border-collapse:collapse;font-size:14px;min-width:420px}
th,td{padding:9px 8px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
tr:hover td{background:#f7f9fc}
.overlay{position:fixed;inset:0;background:rgba(10,20,35,.55);display:flex;align-items:center;justify-content:center;z-index:50;padding:14px}
.modal{background:#fff;border-radius:10px;padding:22px;max-width:440px;width:100%;max-height:85vh;overflow-y:auto}
.error{color:var(--warn);font-size:13px;margin-top:6px}
.tag{display:inline-block;background:#eef2f8;color:var(--navy);padding:3px 8px;border-radius:6px;font-size:12px;margin-right:4px}
.hidden{display:none !important}
footer{text-align:center;padding:20px;color:var(--muted);font-size:12px}
.spinner{display:inline-block;width:14px;height:14px;border:2px solid currentColor;border-top-color:transparent;border-radius:50%;animation:spin .7s linear infinite;vertical-align:-2px;margin-right:6px;opacity:.9}
@keyframes spin{to{transform:rotate(360deg)}}
.loading-box{display:flex;align-items:center;justify-content:center;gap:12px;padding:34px;color:var(--muted)}
.paddle-loader{font-size:28px;display:inline-block;animation:swing .8s ease-in-out infinite;transform-origin:70% 90%}
@keyframes swing{0%,100%{transform:rotate(-25deg)}50%{transform:rotate(25deg)}}
a.link{color:var(--navy);cursor:pointer;text-decoration:underline;font-size:13px}
a.link:hover{color:var(--accent)}
/* game chips */
.gamebar{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.chip{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--navy);background:#fff;color:var(--navy);border-radius:999px;padding:8px 13px;font-size:14px;cursor:pointer;min-height:40px;transition:background .15s,color .15s}
.chip:hover{background:#eef3fb}
.chip.active{background:var(--navy);color:#fff;font-weight:600}
.chip.soft{border-style:dashed;color:var(--muted);border-color:var(--line)}
.gamebar select{width:auto;min-width:150px;padding:8px 10px;font-size:14px;border-radius:999px;border:1px solid var(--navy);color:var(--navy);background:#fff}
.gamebar-label{font-size:12px;color:var(--muted);margin:8px 0 4px}
.stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-top:10px}
.stat-grid .card{margin:0;padding:12px}
.stat-grid .v{font-size:24px;font-weight:700}
.picker-q{margin-bottom:4px;font-size:14px;padding:8px 10px}
details.sport{border:1px solid var(--line);border-radius:8px;margin-bottom:8px;background:#fff}
details.sport>summary{cursor:pointer;padding:10px 12px;font-weight:600;color:var(--navy);list-style:none}
details.sport>summary::-webkit-details-marker{display:none}
details.sport>summary:before{content:'▸ ';}
details.sport[open]>summary:before{content:'▾ ';}
details.sport .inner{padding:0 12px 12px}
.checklist{max-height:220px;overflow:auto;border:1px solid var(--line);border-radius:6px;padding:6px 10px}
@media (max-width:600px){
  header{padding:10px 12px}
  main{padding:10px}
  .card{padding:14px}
  nav button{padding:10px 10px;font-size:13px}
  .row>*{min-width:100%}
}
</style>
</head>

// ---- global state ----
let session=null, me=null, activeTab='dashboard';
let allPlayers=[], players=[];          // allPlayers includes me; players excludes me
let games=[], topGames=[], myGames=[];  // all active games; top 5 by matches; my per-game rows
let cfg={free_limit_enabled:false, free_match_limit:10};

try{ selectedGameId = localStorage.getItem('sttl2_game') || null; }catch(e){}

const app=document.getElementById('app');
const modalRoot=document.getElementById('modalRoot');
const nav=document.getElementById('nav');

function setLoading(btn,on,label){
  if(!btn) return;
  if(on){
    if(btn.dataset.orig===undefined) btn.dataset.orig=btn.innerHTML;
    btn.disabled=true;
    btn.innerHTML='<span class="spinner"></span>'+(label||'Processing...');
  }else{
    btn.disabled=false;
    if(btn.dataset.orig!==undefined){ btn.innerHTML=btn.dataset.orig; delete btn.dataset.orig; }
  }
}
function showLoading(msg){
  app.innerHTML='<div class="card"><div class="loading-box"><span class="paddle-loader">🎮</span><span>'+(msg||'Loading…')+'</span></div></div>';
}
function pwOk(p){return /^(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[^A-Za-z0-9]).{10,}$/.test(p);}
function esc(s){ return String(s??'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function daysSince(d){ if(!d) return 9999; return Math.floor((Date.now()-new Date(d).getTime())/86400000);}
function fmtDate(d){return d? new Date(d).toLocaleDateString():'-';}
function fmtDateTime(d){return d? new Date(d).toLocaleString():'Never';}
function fmtPlayed(d){return d? new Date(d).toLocaleString():'—';}
function localInputValue(dt){
  const x=new Date(dt.getTime()-dt.getTimezoneOffset()*60000);
  return x.toISOString().slice(0,16);
}
async function validateName(name, email, excludeId){
  const n=(name||'').trim(), e=(email||'').trim().toLowerCase();
  if(!n) return 'Please enter a name.';
  if(n.length<2||n.length>40) return 'Your display name must be 2 to 40 characters.';
  if(/[<>]/.test(n)) return 'A display name cannot contain < or >.';
  if(n.toLowerCase()===e) return 'Name cannot be the same as the email address — other players only see the name, so it needs to be a real display name.';
  const {data} = await sb.from('sttl2_players').select('id').ilike('name', n.replace(/[%_]/g,m=>'\\'+m));
  const clash = (data||[]).find(r=>r.id!==excludeId);
  if(clash) return 'That name is already taken by another player — please choose a different display name.';
  return null;
}
// mode 'challenge' = a future/near-future arrangement; 'played' = already played.
function validatePlayWhenVenue(whenVal, venue, mode){
  if(!whenVal) return mode==='played' ? 'Please enter the date and time the match was played.' : 'Please choose the date and time you want to play.';
  const t=new Date(whenVal).getTime();
  if(isNaN(t)) return 'That date and time is not valid.';
  if(!venue) return 'Please type the venue (any place name is fine).';
  if(mode==='played' && t > Date.now()+10*60*1000) return 'A match that has already been played cannot have a date in the future.';
  if(mode==='challenge' && t < Date.now()-60*60*1000) return 'The date and time cannot be more than an hour in the past.';
  return '';
}
function canPlay(p){ return !!p && p.is_approved !== false; }

function modal(html){ modalRoot.innerHTML = `<div class="overlay"><div class="modal">${html}</div></div>`; }
function closeModal(){ modalRoot.innerHTML=''; }
function countryOptions(selected, placeholder){
  return `<option value="">${placeholder||'Select your country…'}</option>` + COUNTRIES.map(c=>`<option value="${esc(c)}" ${c===selected?'selected':''}>${esc(c)}</option>`).join('');
}

// ---------- ratings, levels, avatars ----------
function winPct(wins, losses){
  const total = (wins||0) + (losses||0);
  return total ? Math.round((wins/total)*100) + '%' : '—';
}
// Each game has its own rating system (set in the database: games.rating_system).
const RATING_SYSTEMS = {
  elo:        {name:'Elo (FIDE-style)',             start:1000, scale:1,    score:false, bands:[2700,2200,1700,1200]},
  elo_margin: {name:'Elo with margin of victory',   start:1000, scale:1,    score:true,  bands:[2700,2200,1700,1200]},
  fargo:      {name:'Fargo-style (cue sports)',     start:500,  scale:1,    score:false, bands:[750,650,550,450]},
  dupr:       {name:'DUPR-style (2.000–8.000)',     start:3500, scale:1000, score:true,  bands:[6000,5000,4000,3000]}
};
const sysKey = gid => { const g = (typeof gameById==='function') ? gameById(gid) : null; return (g && RATING_SYSTEMS[g.rating_system]) ? g.rating_system : 'elo'; };
const RS = gid => RATING_SYSTEMS[sysKey(gid)];
const fmtR = (gid,v)=> (v===null||v===undefined) ? '—' : (RS(gid).scale===1000 ? (v/1000).toFixed(3) : String(v));
// +/- badge for the points a player gained or lost in a match (rating_delta is the WINNER's change)
function ptsBadge(gid, delta, iWon){
  if(delta===null || delta===undefined) return '<span class="muted">—</span>';
  const eff = iWon ? delta : -delta;
  const txt = fmtR(gid, Math.abs(eff));
  if(eff===0) return '<span class="badge muted">±0</span>';
  return eff>0 ? `<span class="badge ok">+${txt}</span>` : `<span class="badge warn">−${txt}</span>`;
}
// Optional final score inputs (shown only for games whose rating system uses the margin)
function scoreFieldsHtml(prefix, labelA, labelB, gid){
  if(gid && !RS(gid).score) return '';
  return `<div class="row" id="${prefix}_scoreBox">
    <div><label>${labelA} (optional)</label><input id="${prefix}_sa" type="number" min="0" max="999" inputmode="numeric"></div>
    <div><label>${labelB} (optional)</label><input id="${prefix}_sb" type="number" min="0" max="999" inputmode="numeric"></div>
  </div><p class="muted" style="margin-top:4px">Final score — goals, points or games, whatever this sport counts. Adding it makes the rating more accurate (bigger wins move points more).</p>`;
}
// returns {a,b} (numbers or null) or {error}
function readScores(prefix){
  const ea=document.getElementById(prefix+'_sa'), eb=document.getElementById(prefix+'_sb');
  if(!ea||!eb) return {a:null,b:null};
  const va=ea.value.trim(), vb=eb.value.trim();
  if(va===''&&vb==='') return {a:null,b:null};
  if(va===''||vb==='') return {error:'Enter both scores, or leave both empty.'};
  const a=parseInt(va,10), b=parseInt(vb,10);
  if(!(a>=0&&b>=0&&a<=999&&b<=999)) return {error:'Scores must be whole numbers from 0 to 999.'};
  if(a===b) return {error:'A match needs a winner — the scores cannot be equal.'};
  return {a,b};
}
function ratingLevel(r, gid){
  const b = RS(gid).bands;
  if(r>=b[0]) return 'Pro';
  if(r>=b[1]) return 'Elite';
  if(r>=b[2]) return 'Advanced';
  if(r>=b[3]) return 'Intermediate';
  return 'Beginner';
}
const DUMMY_AVATAR = 'data:image/svg+xml;utf8,' + encodeURIComponent(
  '<svg xmlns="http://www.w3.org/2000/svg" width="100" height="120" viewBox="0 0 100 120">'
  + '<rect width="100" height="120" fill="#d5e6dc"/>'
  + '<circle cx="50" cy="42" r="20" fill="#9fb3a8"/>'
  + '<ellipse cx="50" cy="104" rx="36" ry="28" fill="#9fb3a8"/>'

function compressImage(file, maxDim, quality){
  return new Promise((resolve, reject)=>{
    const img = new Image();
    const reader = new FileReader();
    reader.onerror = ()=>reject(new Error('Could not read the file.'));
    reader.onload = ()=>{
      img.onerror = ()=>reject(new Error('Could not read the image.'));
      img.onload = ()=>{
        let w = img.width, h = img.height;
        if(w > maxDim || h > maxDim){
          if(w >= h){ h = Math.round(h * (maxDim/w)); w = maxDim; }
          else { w = Math.round(w * (maxDim/h)); h = maxDim; }
        }
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        canvas.toBlob(blob=>{
          if(!blob){ reject(new Error('Could not compress the image.')); return; }
          resolve(blob);
        }, 'image/jpeg', quality);
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}

// Pages through a query so lists longer than the server's 1000-row cap load completely.
async function fetchAllRows(build){
  const out=[]; const size=1000;
  for(let from=0;;from+=size){
    const {data,error}=await build(from,from+size-1);
    if(error||!data) break;
    out.push(...data);
    if(data.length<size) break;
  }
  return out;
}

const byName = (a,b)=>String(a.name).localeCompare(String(b.name));
function gameById(id){ return games.find(g=>g.id===id); }
function curGame(){ return gameById(selectedGameId) || null; }
function setSelectedGame(id){ selectedGameId=id; try{ localStorage.setItem('sttl2_game',id); }catch(e){} }
async function loadGames(){
  const {data} = await sb.from('sttl2_games').select('*').eq('is_active',true).order('name');
  games = (data||[]).sort(byName);
  const r = await sb.rpc('sttl2_top_games',{p_limit:5});

  else topGames = [...games].sort((a,b)=>(a.seed_rank-b.seed_rank)||byName(a,b)).slice(0,5);
  if(!gameById(selectedGameId)) setSelectedGame((topGames[0]||games[0]||{}).id || null);
}
async function loadMyGames(){

async function loadConfig(){

async function loadMyMatchCount(){

function wireGameBar(onChange){
  app.querySelectorAll('.chip[data-game]').forEach(b=>{

  });

async function createGame(name, emoji, supportsDoubles, uid){
  const nm = String(name||'').trim().replace(/\s+/g,' ');
  if(nm.length<2 || nm.length>40) return {error:'A game name must be 2 to 40 characters.'};
  if(/[<>]/.test(nm)) return {error:'A game name cannot contain < or >.'};
  const ex = games.find(g=>g.name.toLowerCase()===nm.toLowerCase());
  if(ex) return {game:ex, existing:true};
  const {data,error} = await sb.from('sttl2_games').insert({name:nm, emoji:(emoji||'').trim()||'🎮', supports_doubles:supportsDoubles!==false, created_by:uid}).select().single();
  if(error){
    if(/duplicate|unique/i.test(error.message)){ await loadGames(); const g=games.find(x=>x.name.toLowerCase()===nm.toLowerCase()); if(g) return {game:g, existing:true}; }
    return {error:error.message};
  }
  games.push(data); games.sort(byName);
  return {game:data};
}

    <div class="error" id="ag_err"></div>
    <div class="row" style="margin-top:12px"><button class="btn" id="ag_go">Add game</button><button class="btn ghost" onclick="closeModal()">Cancel</button></div>`);
  document.getElementById('ag_go').onclick = async (e)=>{
    const btn=e.currentTarget, err=document.getElementById('ag_err');
    setLoading(btn,true,'Adding...');
    const r = await createGame(document.getElementById('ag_name').value, document.getElementById('ag_emoji').value, document.getElementById('ag_dbl').checked, me.id);
    if(r.error){ setLoading(btn,false); err.textContent=r.error; return; }

    closeModal(); after();
  };
}

    showJustRegisteredNotice();

  };

// Creates (or completes) the player profile + the chosen games.
async function createProfile(uid, f){
  let r = await sb.from('sttl2_players').upsert({id:uid, name:f.name, country:f.country, city:f.city||null},{onConflict:'id'});
  if(r.error) return r.error.message;
  r = await sb.from('sttl2_player_private').upsert({id:uid, email:f.email, age:f.age},{onConflict:'id'});
  if(r.error) return r.error.message;
  const ids = new Set(f.gameIds||[]);
  if(f.newGameName){
    const g = await createGame(f.newGameName, '', true, uid);
    if(g.error) return g.error;
    ids.add(g.game.id);
  }
  if(ids.size){
    await sb.from('sttl2_player_games').upsert([...ids].map(id=>({player_id:uid, game_id:id})),{onConflict:'player_id,game_id',ignoreDuplicates:true});
  }
  return null;
}

    if(!country){ err.textContent='Please select your country — it is required.'; return; }
    const nameErr = await validateName(name, user.email, user.id);
    if(nameErr){ err.textContent = nameErr; return; }
    setLoading(btn,true,'Saving...');
    const msg = await createProfile(user.id, {name, email:user.email, age, country, city,
      gameIds: document.getElementById('cp_games') ? checkedIds('cp_games') : [],
      newGameName: document.getElementById('cp_newgame') ? document.getElementById('cp_newgame').value.trim() : ''});
    if(msg){ setLoading(btn,false); err.textContent = msg; return; }
    if(!p) showJustRegisteredNotice();
    await loadMeAndBoot();
  };
}

// ---------- BOOT ----------
function logLogin(){
  try{
    const k='sttl2_login_logged_'+me.id;
    const last=+sessionStorage.getItem(k)||0;
    if(Date.now()-last<30*60*1000) return;
    sessionStorage.setItem(k,String(Date.now()));
  }catch(e){}
  try{ sb.from('sttl2_login_log').insert({user_id:me.id}).then(()=>{},()=>{}); }catch(e){}
}
async function loadMeAndBoot(){
  const {data:{user}} = await sb.auth.getUser();
  if(!user){ renderLogin(); return; }
  const {data:p} = await sb.from('sttl2_players').select('*').eq('id',user.id).maybeSingle();
  const {data:pv} = await sb.from('sttl2_player_private').select('email,age,admin_pin_enabled,pin_changed').eq('id',user.id).maybeSingle();
  if(!p || !pv || !p.country || !pv.age){ renderCompleteProfile(user, p, pv); return; }
  me = {...p, email:user.email, age:pv.age, admin_pin_enabled:pv.admin_pin_enabled, pin_changed:pv.pin_changed};
  const previousLoginAt = me.last_login_at;
  sb.from('sttl2_players').update({last_login_at:new Date().toISOString()}).eq('id',me.id).then(()=>{},()=>{});
  me.last_login_at = previousLoginAt;
  logLogin();
  await Promise.all([loadGames(), loadConfig(), loadMyGames(), loadMyMatchCount(), refreshPlayers()]);
  nav.classList.remove('hidden');
  updateWhoBar();
  document.getElementById('adminNavBtn').classList.toggle('hidden', !me.is_admin);
  document.querySelectorAll('.navbtn[data-tab]').forEach(b=>{
    b.onclick=()=>{ if(b.dataset.tab==='play' && !canPlay(me)) return; activeTab=b.dataset.tab; renderTab(); };
  });
  document.getElementById('logoutBtn').onclick = async ()=>{ await sb.auth.signOut(); location.reload(); };
  await checkLoginPopups();
  activeTab='dashboard'; renderTab();
}

async function checkLoginPopups(){
  if(me.last_played_on && daysSince(me.last_played_on) >= 10){
    modal(`
      <h2>We missed you! 👋</h2>
      <p>You haven't played in ${daysSince(me.last_played_on)} days. Let us know why so an admin can follow up.</p>
      <textarea id="reason" rows="3" placeholder="e.g. travelling, injury, busy at work..."></textarea>
      <div class="row" style="margin-top:12px"><button class="btn" id="sendReason">Submit</button></div>
    `);
    document.getElementById('sendReason').onclick = async ()=>{
      const reason=document.getElementById('reason').value.trim();
      if(reason) await sb.from('sttl2_inactivity_notes').insert({player_id:me.id, reason});
      closeModal(); showMatchPopup();
    };
    return;
  }
  showMatchPopup();
}
async function showMatchPopup(){
  const {data:ch} = await sb.from('sttl2_challenges').select('*').or(`challenger_id.eq.${me.id},opponent_id.eq.${me.id},challenger_partner_id.eq.${me.id},opponent_partner_id.eq.${me.id}`).eq('status','accepted');
  const chIds = (ch||[]).map(c=>c.id);
  let results = [];
  if(chIds.length){
    const {data} = await sb.from('sttl2_match_results').select('*').in('challenge_id',chIds);
    results = data || [];
  }
  // Completed matches are not shown — only what still needs something from the player.
  const upcoming = (ch||[]).filter(c => !results.find(r=>r.challenge_id===c.id));
  const pendingAction = results.filter(r => !r.acknowledged && r.entered_by !== me.id);
  const {data:pend} = await sb.from('sttl2_challenges').select('id').eq('opponent_id',me.id).eq('status','pending');
  const totalPendingAction = pendingAction.length + (pend?pend.length:0);
  if(upcoming.length || totalPendingAction){
    modal(`<h2>Welcome back!</h2>
      <p>${upcoming.length} upcoming match(es), ${totalPendingAction} pending action(s) waiting on you.</p>
      <button class="btn" id="okM">Got it</button>`);
    document.getElementById('okM').onclick=closeModal;
  }
}

// ---------- LEADERBOARD DATA (one game at a time) ----------
let boardCache = null; // {gid, rows, results}
async function loadBoard(gid){
  const pgRows = await fetchAllRows((a,b)=>sb.from('sttl2_player_games')
    .select('player_id,rating,wins,losses,played, sttl2_players!inner(id,name,country,city,photo_url,is_approved)')
    .eq('game_id',gid).order('player_id').range(a,b));
  const results = await fetchAllRows((a,b)=>sb.from('sttl2_match_results')
    .select('*, sttl2_challenges!inner(id,game_id,match_type,status,scheduled_at,challenger_id,opponent_id,challenger_partner_id,opponent_partner_id,created_at)').eq('acknowledged',true).eq('sttl2_challenges.game_id',gid).order('id').range(a,b));
  const stat = {};
  const ensure = id => stat[id] || (stat[id] = {singlesWins:0,singlesLosses:0,doublesWins:0,doublesLosses:0});
  results.forEach(r=>{
    const c = r.sttl2_challenges; if(!c) return;
    const dbl = c.match_type==='doubles';
    const A = [c.challenger_id, c.challenger_partner_id].filter(Boolean);
    const B = [c.opponent_id, c.opponent_partner_id].filter(Boolean);
    const win = r.winner_side==='challenger' ? A : B, lose = r.winner_side==='challenger' ? B : A;
    win.forEach(id=>{ const s=ensure(id); if(dbl) s.doublesWins++; else s.singlesWins++; });
    lose.forEach(id=>{ const s=ensure(id); if(dbl) s.doublesLosses++; else s.singlesLosses++; });
  });
  const rows = pgRows.map(x=>{ const pl=pick1(x.sttl2_players); return pl ? ({
    id:x.player_id, name:pl.name, country:pl.country||'', city:pl.city,
    photo_url:pl.photo_url, is_approved:pl.is_approved,
    rating:x.rating, wins:x.wins, losses:x.losses, played:x.played,
    singlesWins:0,singlesLosses:0,doublesWins:0,doublesLosses:0, ...(stat[x.player_id]||{})
  }) : null; }).filter(p=>p && p.is_approved);
  boardCache = {gid, rows, results};
  return boardCache;
}
const rankRows = rows => [...rows].sort((a,b)=> b.rating-a.rating || b.played-a.played || String(a.name).localeCompare(String(b.name)));
function scopeLabel(){
  if(scope==='mine' && me) return me.country;
  if(scope.startsWith('c:')) return scope.slice(2);
  return 'Worldwide';
}
function inScope(p){
  if(scope==='mine' && me) return p.country===me.country;
  if(scope.startsWith('c:')) return p.country===scope.slice(2);
  return true;
}
function scopeBarHtml(rows){
  const countries = [...new Set(rows.map(r=>r.country).filter(Boolean).concat(me&&me.country?[me.country]:[]))].sort((a,b)=>a.localeCompare(b));
  return `<label>Ranking view</label>
    <select id="scopeSel">
      <option value="global" ${scope==='global'?'selected':''}>🌍 Global — everyone using the app</option>
      ${me ? `<option value="mine" ${scope==='mine'?'selected':''}>📍 My country — ${esc(me.country)}</option>` : ''}
      ${countries.map(c=>`<option value="c:${esc(c)}" ${scope==='c:'+c?'selected':''}>${esc(c)}</option>`).join('')}
    </select>`;
}
function monthKeyOf(d){ const x=new Date(d); return x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0'); }
function monthKeyOffset(off){ const x=new Date(); x.setDate(1); x.setMonth(x.getMonth()+off); return monthKeyOf(x); }
function monthLabel(key){ const [y,m]=key.split('-'); return new Date(+y,+m-1,1).toLocaleDateString(undefined,{month:'long',year:'numeric'}); }
function resultPlayedAt(r){ return r.sttl2_challenges?.scheduled_at || r.recorded_at || r.created_at; }
// period: 'overall' or a month key like '2026-10'; limited to the people in `rows`
function mostPlayedRows(period, rows, results){
  const stat={};
  results.forEach(r=>{
    const c=r.sttl2_challenges; if(!c) return;
    if(period!=='overall' && monthKeyOf(resultPlayedAt(r))!==period) return;
    const A=[c.challenger_id,c.challenger_partner_id].filter(Boolean);
    const B=[c.opponent_id,c.opponent_partner_id].filter(Boolean);
    const win = r.winner_side==='challenger'?A:B, lose = r.winner_side==='challenger'?B:A;
    win.forEach(id=>{ const t=stat[id]||(stat[id]={played:0,wins:0,losses:0}); t.played++; t.wins++; });
    lose.forEach(id=>{ const t=stat[id]||(stat[id]={played:0,wins:0,losses:0}); t.played++; t.losses++; });
  });
  return rows.map(p=>({...p, mpPlayed:0, mpWins:0, mpLosses:0, ...(stat[p.id]?{mpPlayed:stat[p.id].played,mpWins:stat[p.id].wins,mpLosses:stat[p.id].losses}:{})}));
}
// Most matches played first; ties: most wins, then higher points, then name A–Z.
function rankMostPlayed(rows){
  return [...rows].sort((a,b)=> b.mpPlayed-a.mpPlayed || b.mpWins-a.mpWins || b.rating-a.rating || String(a.name).localeCompare(String(b.name)));
}
function tieNote(sorted){
  if(sorted.length<2 || sorted[0].mpPlayed===0) return '';
  const a=sorted[0], b=sorted[1];
  if(a.mpPlayed!==b.mpPlayed) return '';
  if(a.mpWins!==b.mpWins) return `tied on ${a.mpPlayed} played — decided by most wins`;
  if(a.rating!==b.rating) return `tied on ${a.mpPlayed} played and ${a.mpWins} wins — decided by higher points`;
  return 'tied on everything — decided alphabetically';
}
const limitFor = list => dashboardShowAll ? Math.min(list.length,500) : 15;

function boardsHtml(g, rows, results, meId){
  const scoped = rows.filter(inScope);

  const curKey = monthKeyOffset(0), lastKey = monthKeyOffset(-1);
  const mpOverall = rankMostPlayed(mostPlayedRows('overall', scoped, results));
  const mpThis = rankMostPlayed(mostPlayedRows(curKey, scoped, results));
  const mpLast = rankMostPlayed(mostPlayedRows(lastKey, scoped, results));
  const mpView = mostPlayedView==='overall' ? {k:'overall',rows:mpOverall,label:'Overall (all time)'}
               : mostPlayedView==='last' ? {k:lastKey,rows:mpLast,label:monthLabel(lastKey)}
               : {k:curKey,rows:mpThis,label:monthLabel(curKey)};
  const leaderLine = rs => rs[0] && rs[0].mpPlayed>0 ? `${esc(rs[0].name)} — ${rs[0].mpPlayed} matches${tieNote(rs)?` <span class="muted">(${tieNote(rs)})</span>`:''}` : '-';
  const champRows = [0,-1,-2,-3,-4,-5].map(off=>{

    return `<tr><td>${monthLabel(k)}</td><td>${r[0]&&r[0].mpPlayed>0? '👑 '+esc(r[0].name):'<span class="muted">No matches</span>'}</td><td>${r[0]&&r[0].mpPlayed>0? r[0].mpPlayed:'—'}</td><td class="muted">${tieNote(r)}</td></tr>`;
  }).join('');
  const typeBoard = (wKey,lKey)=>{
    const list = [...scoped].sort((a,b)=>b[wKey]-a[wKey] || (b[wKey]-b[lKey])-(a[wKey]-a[lKey]) || b.rating-a.rating || String(a.name).localeCompare(String(b.name)));
    return list.slice(0,limitFor(list)).map((p,i)=>`<tr><td>${i+1}</td><td>${who(p)}</td><td>${esc(p.country)}</td><td><b>${fmtR(g.id,p.rating)}</b></td><td>${p[wKey]+p[lKey]}</td><td>${p[wKey]}</td><td>${p[lKey]}</td><td>${winPct(p[wKey],p[lKey])}</td></tr>`).join('') || empty(8);

  const champ = byRating[0];

    <p>🏆 <b>Top rated:</b> ${champ? `${esc(champ.name)} (${esc(champ.country)}) — ${fmtR(g.id,champ.rating)} pts`:'-'}</p>
    <p>🎯 <b>Most played — overall:</b> ${leaderLine(mpOverall)}</p>
    <p>📅 <b>Most played — ${monthLabel(curKey)}:</b> ${leaderLine(mpThis)}</p>
    <p>🗓️ <b>Most played — ${monthLabel(lastKey)}:</b> ${leaderLine(mpLast)}</p>
    <p class="muted">Showing ${dashboardShowAll? 'all' : 'the top 15 of'} ${scoped.length} player(s) in this view.</p>
    <div class="row"><button class="btn ${dashboardShowAll?'ghost':''}" id="dash_top15">Top 15</button><button class="btn ${dashboardShowAll?'':'ghost'}" id="dash_showall">Show all (${scoped.length})</button></div>
  </div>
  <div class="card"><h2>Overall leaderboard (by points)</h2>
    <div class="table-scroll"><table><tr><th>#</th><th>Player</th><th>Country</th><th>Level</th><th>Points</th><th>Played</th><th>W–L</th><th>Win %</th></tr>
    ${byRating.slice(0,limitFor(byRating)).map((p,i)=>`<tr><td>${i+1}</td><td>${who(p)}</td><td>${esc(p.country)}</td><td><span class="tag">${ratingLevel(p.rating,g.id)}</span></td><td><b>${fmtR(g.id,p.rating)}</b></td><td>${p.played}</td><td>${p.wins}–${p.losses}</td><td>${winPct(p.wins,p.losses)}</td></tr>`).join('') || empty(8)}
    </table></div>
  </div>
  <div class="card"><h2>🎯 Most played leaderboard</h2>
    <div class="row">
      <button class="btn ${mpView.k===curKey?'':'ghost'}" id="mp_this">This month</button>
      <button class="btn ${mpView.k===lastKey?'':'ghost'}" id="mp_last">Last month</button>

    ${mpView.rows.slice(0,limitFor(mpView.rows)).map((p,i)=>`<tr><td>${i===0&&p.mpPlayed>0?'👑':i+1}</td><td>${who(p)}</td><td>${esc(p.country)}</td><td>${p.mpPlayed}</td><td>${p.mpWins}</td><td>${p.mpLosses}</td><td>${winPct(p.mpWins,p.mpLosses)}</td><td>${fmtR(g.id,p.rating)}</td></tr>`).join('') || empty(8)}

    <div class="table-scroll"><table>${head8}${typeBoard('doublesWins','doublesLosses')}</table></div>

  <div class="card"><h2>👑 Monthly most-played champions</h2>

    <div class="table-scroll"><table><tr><th>Rating band</th><th>Level</th></tr>
      ${(()=>{ const b=RS(g.id).bands, f=v=>fmtR(g.id,v); return `

      <tr><td>Below ${f(b[3])}</td><td>Beginner — just getting started</td></tr>`; })()}
    </table></div>

// ---------- SEARCHABLE PLAYER PICKERS ----------
function pickerHtml(id,label){
  return `<label>${label}</label>
    <input class="picker-q" id="${id}_q" placeholder="🔍 Search by name or country…" autocomplete="off">
    <select id="${id}"></select>`;
}
function fillPicker(id, list, ratings){
  const sel=document.getElementById(id); if(!sel) return;
  const q=(document.getElementById(id+'_q').value||'').trim().toLowerCase();
  const prev=sel.value;
  const l=list.filter(p=>!q || String(p.name).toLowerCase().includes(q) || String(p.country||'').toLowerCase().includes(q)).slice(0,200);
  sel.innerHTML = l.map(p=>`<option value="${p.id}" data-name="${esc(p.name)}">${esc(p.name)} (${esc(p.country||'—')})${ratings&&ratings[p.id]?' · '+fmtR(selectedGameId,ratings[p.id]):''}</option>`).join('') || '<option value="">No players found</option>';
  if(prev && l.some(p=>p.id===prev)) sel.value=prev;
}
function wirePicker(id, list, ratings, onChange){
  fillPicker(id,list,ratings);
  document.getElementById(id+'_q').oninput = ()=>{ fillPicker(id,list,ratings); if(onChange) onChange(); };
  document.getElementById(id).onchange = ()=>{ if(onChange) onChange(); };
}
function pickedName(id){
  const sel=document.getElementById(id);
  return sel && sel.options[sel.selectedIndex] ? sel.options[sel.selectedIndex].dataset.name || '' : '';
}
async function quietAutoApprove(){

async function loadGameRatings(gid){
  const rows = await fetchAllRows((a,b)=>sb.from('sttl2_player_games').select('player_id,rating').eq('game_id',gid).order('player_id').range(a,b));

}

// Friendly pre-check; the database enforces the same rules (and is the authority).
async function monthlyLimitMessage(g, opponentId, matchType, whenVal){
  const base = whenVal ? new Date(whenVal) : new Date();
  const monthStart=new Date(Date.UTC(base.getUTCFullYear(), base.getUTCMonth(), 1)).toISOString();
  const nextStart=new Date(Date.UTC(base.getUTCFullYear(), base.getUTCMonth()+1, 1)).toISOString();
  const {data:mine}=await sb.from('sttl2_challenges').select('id,match_type,scheduled_at,challenger_id,opponent_id')
    .eq('game_id',g.id).neq('status','declined')
    .gte('scheduled_at', monthStart).lt('scheduled_at', nextStart)
    .or(`challenger_id.eq.${me.id},opponent_id.eq.${me.id},challenger_partner_id.eq.${me.id},opponent_partner_id.eq.${me.id}`);
  const rows=mine||[];
  if(rows.length>=10) return `You have reached the limit of 10 ${g.name} matches in that calendar month.`;
  if(matchType!=='doubles'){
    const dayKey=d=>new Date(d).toISOString().slice(0,10);
    const dup=rows.some(r=>r.match_type!=='doubles' && dayKey(r.scheduled_at)===dayKey(base) && ((r.challenger_id===me.id&&r.opponent_id===opponentId)||(r.challenger_id===opponentId&&r.opponent_id===me.id)));
    if(dup) return `You have already played this player in ${g.name} singles on that day. The same matchup is limited to once a day (and 10 matches a month).`;
  }
  return null;
}

async function renderHistory(){
  showLoading('Loading your sports history…');
  await Promise.all([refreshPlayers(), loadMyGames(), loadGames()]);
  const mineOr = `challenger_id.eq.${me.id},opponent_id.eq.${me.id},challenger_partner_id.eq.${me.id},opponent_partner_id.eq.${me.id}`;
  const chals = await fetchAllRows((a,b)=>sb.from('sttl2_challenges').select('*').or(mineOr).order('scheduled_at',{ascending:false}).order('id').range(a,b));
  let results=[];
  for(let i=0;i<chals.length;i+=150){
    const {data} = await sb.from('sttl2_match_results').select('*').in('challenge_id',chals.slice(i,i+150).map(c=>c.id));
    results.push(...(data||[]));
  }
  const gameIds = new Set([...myGames.map(x=>x.game_id), ...chals.map(c=>c.game_id)]);
  const list = [...gameIds].map(id=>{
    const gm = gameById(id); const mg = myGames.find(x=>x.game_id===id);
    return {id, game:gm, rating:mg?mg.rating:RS(id).start, wins:mg?mg.wins:0, losses:mg?mg.losses:0, played:mg?mg.played:0, matches:chals.filter(c=>c.game_id===id)};
  }).filter(x=>x.game).sort((a,b)=>b.played-a.played || b.matches.length-a.matches.length || byName(a.game,b.game));

  const matchRow = c=>{
    const res = results.find(r=>r.challenge_id===c.id);
    const mySide = (c.challenger_id===me.id || c.challenger_partner_id===me.id);
    const mine = mySide ? sideNames(c.challenger_id,c.challenger_partner_id) : sideNames(c.opponent_id,c.opponent_partner_id);
    const theirs = mySide ? sideNames(c.opponent_id,c.opponent_partner_id) : sideNames(c.challenger_id,c.challenger_partner_id);
    let result, pts='<span class="muted">—</span>';
    if(c.status==='declined') result='<span class="badge muted">Declined</span>';
    else if(c.status==='pending') result='<span class="badge muted">Challenge pending</span>';
    else if(!res) result='<span class="badge warn">Awaiting winner</span>';
    else if(!res.acknowledged) result='<span class="badge warn">Result awaiting acceptance</span>';
    else {
      const won = (res.winner_side==='challenger') === mySide;
      result = won ? '<span class="badge ok">Won</span>' : '<span class="badge warn">Lost</span>';
      if(res.score_challenger!==null && res.score_challenger!==undefined) result += ` <span class="muted">${mySide?res.score_challenger:res.score_opponent}–${mySide?res.score_opponent:res.score_challenger}</span>`;
      if(res.rating_delta!==null && res.rating_delta!==undefined) pts = ptsBadge(c.game_id, res.rating_delta, won);
    }
    return `<tr><td>${fmtPlayed(c.scheduled_at)}</td><td>${c.match_type}</td><td>${mine} <span class="muted">vs</span> ${theirs}</td><td>${esc(c.venue||'—')}</td><td>${result}</td><td>${pts}</td></tr>`;
  };
  app.innerHTML = `
  <div class="card"><h2>My sports</h2>
    <p class="muted">Every game you've played or signed up for, with your rating and record. Open a sport to see each match.</p>
    <div class="table-scroll"><table><tr><th>Sport</th><th>Points</th><th>Level</th><th>Played</th><th>W–L</th><th>Win %</th></tr>
    ${list.map(x=>`<tr><td>${esc(x.game.emoji)} ${esc(x.game.name)}</td><td><b>${fmtR(x.id,x.rating)}</b></td><td><span class="tag">${ratingLevel(x.rating,x.id)}</span></td><td>${x.played}</td><td>${x.wins}–${x.losses}</td><td>${winPct(x.wins,x.losses)}</td></tr>`).join('') || '<tr><td colspan="6" class="muted">No sports yet — pick a game on the Dashboard or Play tab.</td></tr>'}
    </table></div>
  </div>
  <div class="card"><h2>Matches by sport</h2>
    ${list.length ? list.map((x,i)=>`<details class="sport" ${(x.id===selectedGameId||(!gameById(selectedGameId)&&i===0))?'open':''}>
      <summary>${esc(x.game.emoji)} ${esc(x.game.name)} <span class="muted">· ${x.matches.length} match${x.matches.length===1?'':'es'} · ${fmtR(x.id,x.rating)} pts</span></summary>
      <div class="inner">${x.matches.length ? `<div class="table-scroll"><table><tr><th>Played</th><th>Type</th><th>Match</th><th>Venue</th><th>Result</th><th>Points</th></tr>${x.matches.map(matchRow).join('')}</table></div>` : '<p class="muted">No matches yet in this sport.</p>'}</div>
    </details>`).join('') : '<p class="muted">Nothing here yet.</p>'}
  </div>`;
}

function ratingSystemsInfoHtml(){
  const by = {elo:[],elo_margin:[],fargo:[],dupr:[]};
  games.forEach(g=>{ (by[RATING_SYSTEMS[g.rating_system]?g.rating_system:'elo']).push(g); });
  const list = k => by[k].map(g=>`${esc(g.emoji)} ${esc(g.name)}`).join(' · ') || '—';
  return `
  <div class="card"><h3>🏓 Elo — the chess standard (FIDE-style)</h3>
    <p class="muted">${list('elo')}</p>
    <p>Start <b>1000</b>. Expected result = 1 ÷ (1 + 10<sup>(opponent − you) ÷ 400</sup>). Points moved = <b>K × (1 − expected)</b>, where K is <b>40</b> while players are new (under 30 games), <b>20</b> after that, and 10 for very high ratings (2400+). Floor 100.</p>
    <p class="muted">Example: two new players at 1000 → winner +20, loser −20. A 1000 who beats a 1200 (expected 24%) gains 30; if the 1200 wins as expected they gain only 10.</p></div>
  <div class="card"><h3>⚽ Elo with margin of victory (World Football Elo / NBA-style)</h3>
    <p class="muted">${list('elo_margin')}</p>
    <p>Same Elo, but a bigger win is worth more: points = K × <b>margin multiplier</b> × (1 − expected), where the multiplier is (1 + ln(score difference)) — 1 for a one-point win, about 2.1 for a 3–0 — damped when the winner was already the big favourite and capped at 2.5. If no score is entered it works exactly like plain Elo. Start 1000.</p></div>
  <div class="card"><h3>🎱 Fargo-style (cue sports)</h3>
    <p class="muted">${list('fargo')}</p>
    <p>Start <b>500</b>. A 100-point gap means the stronger player is expected to win 2 of every 3 games (odds double every 100 points). Points moved = K × (1 − expected), K 33 for new players (under 30 games), then 17.</p></div>
  <div class="card"><h3>🥒 DUPR-style (pickleball)</h3>
    <p class="muted">${list('dupr')}</p>
    <p>Ratings run from <b>2.000 to 8.000</b>; everyone starts at <b>3.500</b>. The system compares the <b>share of points you won</b> with the share your rating predicted, so a narrow win by the favourite can even lower their rating, while a close loss by the underdog can raise theirs. Change = K × (actual share − expected share), K 0.20 for your first 20 matches, then 0.10. Enter the score (e.g. 11–5) for the most accurate result; with no score, a typical 65% points share is assumed.</p></div>`;
}

// Admin sections start collapsed; the ones the admin has opened are
// remembered so an action that re-renders the tab doesn't snap them shut.
const adminOpenSections = new Set();
function makeCollapsible(container){
  [...container.children].filter(el=>el.classList.contains('card')).forEach(card=>{
    const h2 = [...card.children].find(el=>el.tagName==='H2');
    if(!h2) return;
    const label = h2.textContent;
    const body = document.createElement('div');
    body.className = 'collapsible-body';
    [...card.childNodes].forEach(n=>{ if(n!==h2) body.appendChild(n); });
    card.appendChild(body);
    card.classList.add('admin-card');
    h2.classList.add('collapsible-header');
    const setState = (open)=>{
      body.classList.toggle('hidden', !open);
      h2.textContent = (open ? '▾ ' : '▸ ') + label;
    };
    setState(adminOpenSections.has(label));
    h2.onclick = ()=>{
      const open = body.classList.contains('hidden');
      if(open) adminOpenSections.add(label); else adminOpenSections.delete(label);
      setState(open);
    };
  });
}
window.openAdminSection = (label)=>{ adminOpenSections.add(label); renderAdmin(); };

let adminPlayerList = [];
let adminGames = [];
async function adminFetchPlayers(q){
  const sel = '*, sttl2_player_private(email,age)';
  q = (q||'').trim();
  if(!q){
    const {data} = await sb.from('sttl2_players').select(sel).order('created_at',{ascending:false}).limit(100);
    return data||[];
  }
  const like = '%'+q.replace(/[%,()]/g,' ')+'%';
  const a = await sb.from('sttl2_players').select(sel).or(`name.ilike.${like},country.ilike.${like},city.ilike.${like}`).limit(100);
  const b = await sb.from('sttl2_player_private').select('id').ilike('email',like).limit(100);
  const have = new Set((a.data||[]).map(p=>p.id));
  const extraIds = (b.data||[]).map(x=>x.id).filter(id=>!have.has(id));
  let extra=[];
  if(extraIds.length){ const r = await sb.from('sttl2_players').select(sel).in('id',extraIds); extra=r.data||[]; }
  return [...(a.data||[]), ...extra];
}
const pvOf = p => pick1(p.sttl2_player_private) || {};

async function renderAdmin(){
  showLoading('Loading admin tools…');
  await quietAutoApprove();
  await Promise.all([refreshPlayers(), loadConfig()]);
  const gm = await sb.from('sttl2_games').select('*').order('name');
  adminGames = gm.data||[];
  const gameMatchCount = {};
  (await fetchAllRows((a,b)=>sb.from('sttl2_challenges').select('id,game_id').order('id').range(a,b))).forEach(c=>{ gameMatchCount[c.game_id]=(gameMatchCount[c.game_id]||0)+1; });
  adminPlayerList = await adminFetchPlayers('');
  const totalPlayers = (await sb.from('sttl2_players').select('id',{count:'exact',head:true})).count || 0;
  const notes = await sb.from('sttl2_inactivity_notes').select('*, sttl2_players!inner(name)').order('created_at',{ascending:false}).limit(100);
  const auditQ = await sb.from('sttl2_audit_log').select('at,action,detail').order('at',{ascending:false}).limit(60);
  const auditRows = auditQ.error ? null : (auditQ.data||[]);
  let actStats=null, anomalies=[], dashErr='';
  try{
    const r1 = await sb.rpc('sttl2_admin_activity_stats',{p_days:30});
    if(r1.error) dashErr = r1.error.message; else actStats = r1.data;
    const r2 = await sb.rpc('sttl2_admin_match_anomalies');
    if(r2.error) dashErr = dashErr || r2.error.message; else anomalies = r2.data || [];
  }catch(e){ dashErr = String(e&&e.message||e); }
  const {data:chals} = await sb.from('sttl2_challenges').select('*').order('scheduled_at',{ascending:false,nullsFirst:false}).limit(100);
  const cIds = (chals||[]).map(c=>c.id);
  let cResults = [];
  if(cIds.length){ const {data} = await sb.from('sttl2_match_results').select('*').in('challenge_id',cIds); cResults = data||[]; }
  const gTag = id => { const x=adminGames.find(g=>g.id===id); return x?`${esc(x.emoji)} ${esc(x.name)}`:'—'; };
  const side = (a,b)=> nameOf(a)+(b?' &amp; '+nameOf(b):'');

  const matchRowsAdmin = (chals||[]).slice(0,60).map(c=>{
    const res = cResults.find(r=>r.challenge_id===c.id);
    const winnerName = res ? (res.winner_side==='challenger'? nameOf(c.challenger_id) : nameOf(c.opponent_id)) : '-';
    const over48 = res && !res.acknowledged && (new Date(res.created_at) < new Date(Date.now()-48*3600*1000));
    const resultText = !res ? '<span class="badge muted">No result yet</span>'
      : (res.acknowledged ? `<span class="badge ok">Recorded — ${winnerName}</span>`
        : (over48 ? '<span class="badge warn">Pending 48h+ (auto-approves soon)</span>' : '<span class="badge warn">Pending acceptance</span>'));
    const approveBtn = (res && !res.acknowledged) ? `<button class="btn" onclick="adminApproveResult(this,'${res.id}')">Approve</button> ` : '';
    return `<tr><td>${gTag(c.game_id)}</td><td>${fmtPlayed(c.scheduled_at)}</td><td>${side(c.challenger_id,c.challenger_partner_id)}</td><td>${side(c.opponent_id,c.opponent_partner_id)}</td><td>${c.match_type}</td><td>${c.status}</td><td>${resultText}</td><td class="muted">${fmtDateTime(c.created_at)}</td><td>${approveBtn}<button class="btn danger" onclick="deleteMatch(this,'${c.id}')">Delete</button></td></tr>`;
  }).join('') || '<tr><td colspan="9" class="muted">No matches yet.</td></tr>';

  const historyRows = (type)=> (chals||[]).filter(c=>c.match_type===type).map(c=>({c, r:cResults.find(x=>x.challenge_id===c.id && x.acknowledged)})).filter(x=>x.r).slice(0,25).map(({c,r})=>{
    const s1=side(c.challenger_id,c.challenger_partner_id), s2=side(c.opponent_id,c.opponent_partner_id);

  }).join('') || '<tr><td colspan="6" class="muted">No matches recorded yet.</td></tr>';

  const sevBadge = sv => `<span class="badge ${sv==='high'?'warn':(sv==='medium'?'muted':'ok')}">${esc(sv)}</span>`;
  const flagsByMatch = {};
  anomalies.forEach(a=>{ if(a.match_id){ (flagsByMatch[a.match_id] = flagsByMatch[a.match_id] || []).push(a); } });

  const periodTable = (rows, labelFn)=>{

  };
  const dayLbl = d => new Date(d+'T00:00:00').toLocaleDateString(undefined,{weekday:'short',day:'numeric',month:'short'});
  let activityHtml;
  if(actStats){
    const dly=actStats.daily||[], wk=actStats.weekly||[], mo=actStats.monthly||[];

        <div class="card"><div class="muted">This month</div><div class="v">${mo[0]?mo[0].users:0}</div></div>
        <div class="card"><div class="muted">Matches played today</div><div class="v">${dly[0]?dly[0].matches:0}</div></div>
        <div class="card"><div class="muted">This week</div><div class="v">${wk[0]?wk[0].matches:0}</div></div>
        <div class="card"><div class="muted">This month</div><div class="v">${mo[0]?mo[0].matches:0}</div></div>
      </div>

      <h3>Monthly</h3>${periodTable(mo, r=>new Date(r.start+'T00:00:00').toLocaleDateString(undefined,{month:'long',year:'numeric'}))}`;

    activityHtml = `<p class="muted">Activity numbers aren't available yet. Run the latest <b>sttl2_schema.sql</b> in the Supabase SQL editor to switch this on.</p><div class="error">${esc(dashErr)}</div>`;

  const flagsHtml = dashErr && !anomalies.length
    ? `<p class="muted">Flags aren't available yet — run the latest <b>sttl2_schema.sql</b>.</p>`
    : (anomalies.length
      ? `<div class="table-scroll" style="max-height:320px;overflow:auto"><table><tr><th>Severity</th><th>Flag</th><th>Details</th><th>Played</th><th>Created</th></tr>${anomalies.map(a=>`<tr><td>${sevBadge(a.severity)}</td><td>${esc(a.flag)}</td><td>${esc(a.detail)}</td><td>${fmtPlayed(a.played_at)}</td><td>${a.created_at?fmtDateTime(a.created_at):'—'}</td></tr>`).join('')}</table></div>`
      : '<p>✅ No abnormalities found.</p>');
  const matchDetailRows = (chals||[]).map(c=>{
    const res = cResults.find(r=>r.challenge_id===c.id);
    const fl = flagsByMatch[c.id] || [];
    const sideA = side(c.challenger_id,c.challenger_partner_id), sideB = side(c.opponent_id,c.opponent_partner_id);
    const winner = res ? (res.winner_side==='challenger'? sideA : sideB) : '—';
    const resTxt = !res ? '<span class="badge muted">No result</span>' : (res.acknowledged ? `<span class="badge ok">Recorded</span> 🏆 ${winner}` : `<span class="badge warn">Pending</span> 🏆 ${winner}`);
    const pts = res && res.acknowledged && res.rating_delta!==null && res.rating_delta!==undefined ? `±${fmtR(c.game_id,Math.abs(res.rating_delta))}` : '—';
    const flagTxt = fl.length ? fl.map(f=>`<span class="badge ${f.severity==='high'?'warn':'muted'}" title="${esc(f.detail)}">${esc(f.flag)}</span>`).join(' ') : '';
    const gname = (adminGames.find(g=>g.id===c.game_id)||{}).name || '';
    const searchText = (sideA+' '+sideB+' '+(c.venue||'')+' '+c.match_type+' '+gname).replace(/&amp;/g,'&').toLowerCase();
    return `<tr class="md-row" data-flagged="${fl.length?1:0}" data-text="${esc(searchText)}"><td>${gTag(c.game_id)}</td><td>${fmtPlayed(c.scheduled_at)}</td><td>${c.venue?esc(c.venue):'—'}</td><td>${c.match_type}</td><td>${sideA}</td><td>${sideB}</td><td>${resTxt}</td><td>${pts}</td><td>${flagTxt}</td><td class="muted">${fmtDateTime(c.created_at)}</td></tr>`;
  }).join('') || '<tr><td colspan="10" class="muted">No matches yet.</td></tr>';
  const flagBanner = dashErr && !anomalies.length ? '' : (anomalies.length
    ? `<div class="card" style="border-left:4px solid var(--warn);cursor:pointer" onclick="openAdminSection('Match review &amp; flags')"><b>⚠️ ${anomalies.length} item(s) flagged for review</b> <span class="muted">— (${anomalies.filter(a=>a.severity==='high').length} high). Tap to open “Match review &amp; flags”.</span></div>`
    : `<div class="card" style="border-left:4px solid var(--ok)"><b>✅ No match abnormalities flagged.</b></div>`);

  const approvedPlayers = [...allPlayers].filter(p=>p.is_approved).sort(byName);
  const activeGames = adminGames.filter(g=>g.is_active);
  const defGame = activeGames.find(g=>g.id===selectedGameId) || activeGames[0];

  app.innerHTML = `
  ${flagBanner}
  <div class="card"><h2>Activity dashboard</h2>${activityHtml}</div>
  <div class="card"><h2>Match review &amp; flags</h2>
    <h3>Flagged items</h3>${flagsHtml}
    <h3>Match details (latest 100 by played date)</h3>
    <div class="row" style="align-items:center">
      <input id="mdFilter" placeholder="Filter by player, game, venue or type…">
      <label class="inline" style="flex:0 0 auto;white-space:nowrap"><input type="checkbox" id="mdFlagged"> Flagged only</label>
    </div>
    <div class="table-scroll" style="max-height:420px;overflow:auto"><table><tr><th>Game</th><th>Played</th><th>Venue</th><th>Type</th><th>Side A</th><th>Side B</th><th>Result</th><th>Points</th><th>Flags</th><th>Created (admin)</th></tr>${matchDetailRows}</table></div>
  </div>
  <div class="card"><h2>Admin settings</h2>
    ${me.admin_pin_enabled && me.pin_changed===false ? '<p class="error">⚠️ The admin PIN is still the default (1234). Please set your own below.</p>' : ''}
    ${!me.admin_pin_enabled ? '<p class="error">⚠️ The admin PIN is switched off — anyone using an admin login can open this tab.</p>' : ''}
    <label class="inline"><input type="checkbox" id="pinToggle" ${me.admin_pin_enabled?'checked':''}> Require PIN to open Admin tab</label>
    <label>Change admin PIN (4–8 digits — leave blank to keep the current one)</label>
    <input id="newPin" type="password" inputmode="numeric" maxlength="8" placeholder="••••" style="max-width:140px">
    <h3>Free-play limit (validation for later)</h3>
    <label class="inline"><input type="checkbox" id="flToggle" ${cfg.free_limit_enabled?'checked':''}> Limit free play — each player gets a set number of free matches, then must be marked “Subscribed”</label>
    <label>Free matches per player</label>
    <input id="flCount" type="number" min="1" max="1000" value="${cfg.free_match_limit}" style="max-width:140px">

    <h3>Privacy &amp; security switches</h3>

    <div class="error" id="cfg_err"></div>
    <button class="btn" id="saveCfg" style="margin-top:10px">Save settings</button>

  </div>
  <div class="card"><h2>Games</h2>

    <div class="table-scroll"><table><tr><th>Game</th><th>Doubles</th><th>Matches</th><th>Status</th><th>Actions</th></tr>
    ${adminGames.map(g=>`<tr><td>${esc(g.emoji)} ${esc(g.name)}</td><td>${g.supports_doubles?'✓':'—'}</td><td>${gameMatchCount[g.id]||0}</td><td>${g.is_active?'<span class="badge ok">Active</span>':'<span class="badge muted">Hidden</span>'}</td>
      <td><button class="btn ghost" onclick="editGame('${g.id}')">✏️ Edit</button> <button class="btn danger" onclick="deleteGame(this,'${g.id}')">🗑️ Delete</button></td></tr>`).join('')}
    </table></div>

      <div style="flex:0 0 auto;min-width:0"><label class="inline"><input type="checkbox" id="ng_dbl" checked> Doubles</label></div>
      <div style="flex:0 0 auto;min-width:0"><button class="btn" id="ng_go">Add</button></div>
    </div>
    <div class="error" id="ng_err"></div>
  </div>
  <div class="card"><h2>Add a new player</h2>
    <div class="row">
      <div><label>Name</label><input id="nu_name" maxlength="40"></div>
      <div><label>Email</label><input id="nu_email" type="email"></div>
    </div>
    <div class="row">
      <div><label>Temp password</label><input id="nu_pw" type="password" autocomplete="new-password"></div>
      <div><label>Age</label><input id="nu_age" type="number"></div>
    </div>
    <div class="row">
      <div><label>Country</label><select id="nu_country">${countryOptions('', 'Select country…')}</select></div>
      <div><label>City / club (optional)</label><input id="nu_city" maxlength="60"></div>
    </div>
    <div class="error" id="nu_err"></div>
    <button class="btn" id="nu_go" style="margin-top:10px">Add player</button>
  </div>
  <div class="card"><h2>Manage players</h2>
    <label>Search (name, country, city or email) — ${totalPlayers} registered; showing up to 100</label>
    <input id="playerSearch" placeholder="Start typing to search...">
    <div id="playersList" style="margin-top:10px"></div>
  </div>
  <div class="card"><h2>Manually enter a match result</h2>
    <p class="muted">For recording a match directly — historical results, or games played outside the app. This applies points immediately; no opponent acceptance needed. The same monthly limits still apply.</p>
    <label>Game</label>
    <select id="am_game">${activeGames.map(g=>`<option value="${g.id}" ${defGame&&g.id===defGame.id?'selected':''}>${esc(g.emoji)} ${esc(g.name)}</option>`).join('')}</select>
    <label>Match type</label>
    <select id="am_type"><option value="singles">Singles</option><option value="doubles">Doubles</option></select>
    <div class="row">
      <div>${pickerHtml('am_a','Side A player')}</div>
      <div id="am_a_partner_box" class="hidden">${pickerHtml('am_a_partner','Side A partner')}</div>
    </div>
    <div class="row">
      <div>${pickerHtml('am_b','Side B player')}</div>
      <div id="am_b_partner_box" class="hidden">${pickerHtml('am_b_partner','Side B partner')}</div>
    </div>
    <label>Winner</label>
    <select id="am_winner"><option value="challenger">Side A</option><option value="opponent">Side B</option></select>
    ${scoreFieldsHtml('am','Side A score','Side B score',null)}
    <p class="muted" style="margin-top:0">Scores are used only by games on a margin-based or DUPR-style rating (and ignored for the others).</p>
    <label>Date &amp; time played (required)</label>
    <input type="datetime-local" id="am_when">
    <label>Venue (required)</label>
    <input id="am_venue" maxlength="120" placeholder="Any place name">
    <button class="btn" id="am_submit" style="margin-top:12px">Record match</button>
    <div class="error" id="am_err"></div>

  <div class="card"><h2>Manage matches</h2>

    <div class="table-scroll"><table><tr><th>Game</th><th>Played</th><th>Side A</th><th>Side B</th><th>Type</th><th>Status</th><th>Result</th><th>Created (admin)</th><th>Actions</th></tr>${matchRowsAdmin}</table></div>
  </div>
  <div class="card"><h2>Singles match history</h2>
    <div class="table-scroll"><table><tr><th>Game</th><th>Played</th><th>Player 1</th><th>Player 2</th><th>Winner</th><th>Points</th></tr>${historyRows('singles')}</table></div>
  </div>
  <div class="card"><h2>Doubles match history</h2>
    <div class="table-scroll"><table><tr><th>Game</th><th>Played</th><th>Team 1</th><th>Team 2</th><th>Winner</th><th>Points</th></tr>${historyRows('doubles')}</table></div>
  </div>
  <div class="card"><h2>Inactivity notes</h2>
    ${(notes.data||[]).map(n=>`<p><b>${esc(n.sttl2_players?.name||'')}</b>: ${esc(n.reason)} <span class="muted">(${fmtDate(n.created_at)})</span></p>`).join('')||'<p class="muted">None.</p>'}
  </div>`;

  // ----- settings
  document.getElementById('saveCfg').onclick = async (e)=>{
    const btn=e.currentTarget, err=document.getElementById('cfg_err');
    err.style.color='var(--warn)'; err.textContent='';
    const pinToggle=document.getElementById('pinToggle').checked;
    const newPin=document.getElementById('newPin').value.trim();
    const flOn=document.getElementById('flToggle').checked;
    const flN=parseInt(document.getElementById('flCount').value,10);
    if(newPin && !/^\d{4,8}$/.test(newPin)){ err.textContent='The PIN must be 4 to 8 digits.'; return; }
    if(newPin && ['1234','0000','1111','12345','123456','1234567','12345678','4321','000000','111111'].includes(newPin)){ err.textContent='That PIN is too easy to guess — choose another.'; return; }
    if(!(flN>=1)){ err.textContent='Free matches per player must be 1 or more.'; return; }
    setLoading(btn,true,'Saving...');
    const upd = {admin_pin_enabled:pinToggle}; if(newPin) upd.admin_pin=newPin;
    const r1 = await sb.from('sttl2_player_private').update(upd).eq('id',me.id);
    const r2 = await sb.from('sttl2_app_config').update({free_limit_enabled:flOn, free_match_limit:flN, guest_view_enabled:document.getElementById('guestToggle').checked, allow_detail_reset:document.getElementById('detailToggle').checked}).eq('id',1);
    if(r1.error||r2.error){ setLoading(btn,false); err.textContent=(r1.error||r2.error).message; return; }
    me.admin_pin_enabled=pinToggle; if(newPin) me.pin_changed=true; await loadConfig(); updateWhoBar();
    adminOpenSections.add('Admin settings');
    renderAdmin();
  };
  // ----- games
  document.getElementById('ng_go').onclick = async (e)=>{
    const btn=e.currentTarget, err=document.getElementById('ng_err'); err.textContent='';
    setLoading(btn,true,'Adding...');
    const r = await createGame(document.getElementById('ng_name').value, document.getElementById('ng_emoji').value, document.getElementById('ng_dbl').checked, me.id);
    if(r.error){ setLoading(btn,false); err.textContent=r.error; return; }
    adminOpenSections.add('Games'); renderAdmin();
  };

  document.getElementById('nu_go').onclick = async (e)=>{
    const btn=e.currentTarget, err=document.getElementById('nu_err');
    err.style.color='var(--warn)'; err.textContent='';
    const name=document.getElementById('nu_name').value.trim();
    const email=document.getElementById('nu_email').value.trim();
    const password=document.getElementById('nu_pw').value;
    const age=parseInt(document.getElementById('nu_age').value,10);
    const country=document.getElementById('nu_country').value;
    const city=document.getElementById('nu_city').value.trim();
    if(!name||!email||!pwOk(password)||!age||!country){ err.textContent='Fill all fields (country too); the password needs upper/lower/number/special, 8+ chars.'; return; }
    const nameErr = await validateName(name, email);
    if(nameErr){ err.textContent = nameErr; return; }
    setLoading(btn,true,'Adding...');
    let newId=null;
    const {data:cd, error:ce} = await getSbAdmin().auth.signUp({email,password});
    const alreadyReg = !!ce && /already/i.test(ce.message||'');
    if(ce && !alreadyReg){ setLoading(btn,false); err.textContent = ce.message; return; }
    if(!ce && cd.user && !(cd.user.identities && cd.user.identities.length===0)){ newId = cd.user.id; }
    else {
      // The email already has a login (maybe an earlier attempt made it but not the profile): recover with the typed password.
      const {data:si, error:siErr} = await getSbAdmin().auth.signInWithPassword({email,password});
      if(siErr || !si?.user){ setLoading(btn,false); err.textContent='That email already has a login and the password typed does not match it, so the profile cannot be attached. Use the password they registered with, or ask them to log in and finish their profile.'; return; }
      newId = si.user.id;
      try{ await getSbAdmin().auth.signOut(); }catch(_){}
    }
    const {data:ex} = await sb.from('sttl2_players').select('id').eq('id',newId).maybeSingle();
    if(ex){ setLoading(btn,false); err.textContent='That player already exists in the list below.'; return; }

    const pl=document.getElementById('playersList'); if(pl && pl.firstElementChild) pl.firstElementChild.style.outline='2px solid var(--ok)';
  };
  // ----- manage players
  function playerRowHtml(p){

    return `<div class="player-item">
      <div class="player-item-head">

      </div>
      <div class="player-item-meta">
        <span>🌍 ${esc(p.country||'— no country —')}${p.city?' · '+esc(p.city):''}</span>
        <span>🎂 ${pv.age||'—'}</span>
        <span>🕒 ${fmtDateTime(p.last_login_at)}</span>
      </div>
      <div class="player-item-meta">
        ${p.is_approved?'<span class="badge ok">✅ Active</span>':'<span class="badge warn">⏸ Paused</span>'}
        <label class="inline" style="margin:0;font-size:13px;cursor:pointer">
          <input type="checkbox" ${p.is_subscribed?'checked':''} onchange="toggleSubscription(this,'${p.id}')"> 💳 Subscribed
        </label>
      </div>
      <div class="row" style="margin-top:8px">
        ${p.is_approved?`<button class="btn ghost" onclick="setActive(this,'${p.id}',false)">⏸ Pause</button>`:`<button class="btn" onclick="setActive(this,'${p.id}',true)">▶ Reactivate</button>`}

        <button class="btn danger" onclick="deleteUser(this,'${p.id}')">🗑️ Remove</button>
      </div>
    </div>`;
  }
  const renderPlayerRows = list => {
    document.getElementById('playersList').innerHTML = list.length ? list.map(playerRowHtml).join('') : '<p class="muted">No players match your search.</p>';
  };
  renderPlayerRows(adminPlayerList);
  let searchTimer=null;
  document.getElementById('playerSearch').oninput = (e)=>{
    clearTimeout(searchTimer);
    const q=e.target.value;
    searchTimer=setTimeout(async ()=>{ adminPlayerList = await adminFetchPlayers(q); renderPlayerRows(adminPlayerList); }, 300);
  };
  // ----- manual match entry
  const amList = approvedPlayers;
  const updAm = ()=>{

  };
  ['am_a','am_a_partner','am_b','am_b_partner'].forEach(id=>wirePicker(id, amList, null, updAm));
  const syncAmType = ()=>{
    const g = adminGames.find(x=>x.id===document.getElementById('am_game').value);
    const typeSel = document.getElementById('am_type');
    const dblOpt = [...typeSel.options].find(o=>o.value==='doubles');
    if(g && !g.supports_doubles){ if(typeSel.value==='doubles') typeSel.value='singles'; dblOpt.disabled=true; dblOpt.textContent='Doubles (not available for this game)'; }
    else if(dblOpt){ dblOpt.disabled=false; dblOpt.textContent='Doubles'; }
    const dbl = typeSel.value==='doubles';
    document.getElementById('am_a_partner_box').classList.toggle('hidden', !dbl);
    document.getElementById('am_b_partner_box').classList.toggle('hidden', !dbl);
    updAm();
  };
  document.getElementById('am_game').onchange = syncAmType;
  document.getElementById('am_type').onchange = syncAmType;
  syncAmType();
  const applyMdFilter = ()=>{
    const q=(document.getElementById('mdFilter').value||'').trim().toLowerCase();
    const fo=document.getElementById('mdFlagged').checked;
    document.querySelectorAll('tr.md-row').forEach(tr=>{
      const okText = !q || (tr.dataset.text||'').includes(q);
      const okFlag = !fo || tr.dataset.flagged==='1';
      tr.classList.toggle('hidden', !(okText && okFlag));
    });
  };
  document.getElementById('mdFilter').oninput = applyMdFilter;
  document.getElementById('mdFlagged').onchange = applyMdFilter;
  document.getElementById('am_when').max = localInputValue(new Date());
  document.getElementById('am_submit').onclick = async (e)=>{
    const btn=e.currentTarget, err=document.getElementById('am_err'); err.textContent='';
    const game=document.getElementById('am_game').value;
    const match_type=document.getElementById('am_type').value;
    const dbl = match_type==='doubles';
    const pA=document.getElementById('am_a').value, pB=document.getElementById('am_b').value;
    const pAP = dbl ? document.getElementById('am_a_partner').value : null;
    const pBP = dbl ? document.getElementById('am_b_partner').value : null;
    const winner=document.getElementById('am_winner').value;
    const sc=readScores('am'); if(sc.error){ err.textContent=sc.error; return; }
    if(sc.a!==null && ((winner==='challenger') !== (sc.a>sc.b))){ err.textContent='The winner must have the higher score.'; return; }
    const whenVal=document.getElementById('am_when').value;
    const venue=document.getElementById('am_venue').value.trim();
    const chk=validatePlayWhenVenue(whenVal, venue, 'played');
    if(chk){ err.textContent=chk; return; }
    const ids = dbl ? [pA,pB,pAP,pBP] : [pA,pB];
    if(ids.some(x=>!x) || new Set(ids).size!==ids.length){ err.textContent = dbl ? 'Each of the four players in a doubles match must be different.' : 'Side A and Side B must be different players.'; return; }
    setLoading(btn,true,'Recording...');
    const rpcArgs = {
      p_game:game, p_challenger:pA, p_challenger_partner:pAP, p_opponent:pB, p_opponent_partner:pBP,
      p_match_type:match_type, p_winner_side:winner, p_venue:venue, p_scheduled_at:new Date(whenVal).toISOString()
    };
    if(sc.a!==null){ rpcArgs.p_score_challenger=sc.a; rpcArgs.p_score_opponent=sc.b; }
    const {error} = await sb.rpc('sttl2_admin_record_match', rpcArgs);
    setLoading(btn,false);
    if(error){ alert('Could not record match: '+error.message); return; }
    adminOpenSections.add('Manually enter a match result');
    renderAdmin();
  };
  makeCollapsible(app);
}

window.toggleSubscription = async (checkbox,id)=>{
  const newVal = checkbox.checked;
  checkbox.disabled = true;
  const {error} = await sb.from('sttl2_players').update({is_subscribed:newVal}).eq('id',id);
  checkbox.disabled = false;
  if(error){ alert('Could not update subscription: '+error.message); checkbox.checked = !newVal; }
};
window.setActive = async (btn,id,active)=>{
  if(!active && id===me.id){ alert("You can't pause your own account."); return; }
  setLoading(btn,true,'Saving...');
  const {error} = await sb.from('sttl2_players').update({is_approved:active}).eq('id',id);
  if(error){ setLoading(btn,false); alert(error.message); return; }
  adminOpenSections.add('Manage players'); renderAdmin();
};
window.adminApproveResult = async (btn,resultId)=>{
  if(!confirm("Approve this result on the opponent's behalf? This updates the players' ratings.")) return;
  setLoading(btn,true,'Approving...');
  const {error} = await sb.rpc('sttl2_admin_approve_result', {p_result_id: resultId});
  setLoading(btn,false);
  if(error){ alert('Could not approve: '+error.message); return; }
  adminOpenSections.add('Manage matches'); renderAdmin();
};
window.deleteMatch = async (btn,challengeId)=>{
  if(!confirm('Delete this match? This removes the challenge and any recorded result.\nIt will NOT reverse rating points already applied.')) return;
  setLoading(btn,true,'Deleting...');
  const {error} = await sb.from('sttl2_challenges').delete().eq('id',challengeId);
  setLoading(btn,false);
  if(error){ alert('Could not delete match: '+error.message); return; }
  adminOpenSections.add('Manage matches'); renderAdmin();
};
window.deleteUser = async (btn,id)=>{
  if(id===me.id){ alert("You can't remove your own account."); return; }
  if(!confirm('Remove this player?\n\nThis deletes their profile, ratings and match links. Their login will still exist in Supabase Auth — remove it there too if you want them fully gone.')) return;
  setLoading(btn,true,'Removing...');
  const {error} = await sb.from('sttl2_players').delete().eq('id',id);
  if(error){ setLoading(btn,false); alert('Could not remove player: '+error.message); return; }
  adminOpenSections.add('Manage players'); renderAdmin();
};
window.editUser = async (id)=>{
  const p = adminPlayerList.find(x=>x.id===id) || allPlayers.find(x=>x.id===id);
  if(!p) return;
  const pv = pvOf(p);
  modal(`<h2>Edit ${esc(p.name)}</h2>
    <label>Name</label><input id="e_name" maxlength="40" value="${esc(p.name)}">
    <label>Age</label><input id="e_age" type="number" value="${pv.age||''}">
    <label>Country</label><select id="e_country">${countryOptions(p.country||'', 'Select country…')}</select>
    <label>City / club</label><input id="e_city" maxlength="60" value="${esc(p.city||'')}">
    <label class="inline"><input type="checkbox" id="e_sub" ${p.is_subscribed?'checked':''}> Subscribed</label>
    <label class="inline"><input type="checkbox" id="e_admin" ${p.is_admin?'checked':''}> Admin</label>
    <div class="error" id="e_err"></div>
    <div class="row" style="margin-top:12px"><button class="btn" onclick="saveEdit(this,'${id}')">Save</button><button class="btn ghost" onclick="closeModal()">Cancel</button></div>`);
};
window.saveEdit = async (btn,id)=>{
  const err=document.getElementById('e_err'); err.textContent='';
  const email = pvOf(adminPlayerList.find(x=>x.id===id)||{}).email || '';
  const name=document.getElementById('e_name').value.trim();
  const age=parseInt(document.getElementById('e_age').value,10);
  const country=document.getElementById('e_country').value;
  if(!name||!age||!country){ err.textContent='Name, age and country are required.'; return; }
  if(id===me.id && !document.getElementById('e_admin').checked){ err.textContent="You can't remove your own admin rights."; return; }
  const nameErr = await validateName(name, email, id);
  if(nameErr){ err.textContent = nameErr; return; }
  setLoading(btn,true,'Saving...');
  const r1 = await sb.from('sttl2_players').update({name, country, city:document.getElementById('e_city').value.trim()||null,
    is_subscribed:document.getElementById('e_sub').checked, is_admin:document.getElementById('e_admin').checked}).eq('id',id);
  const r2 = await sb.from('sttl2_player_private').update({age}).eq('id',id);
  if(r1.error||r2.error){ setLoading(btn,false); err.textContent=(r1.error||r2.error).message; return; }
  closeModal(); adminOpenSections.add('Manage players'); renderAdmin();
};
window.editGame = (id)=>{
  const g = adminGames.find(x=>x.id===id); if(!g) return;
  modal(`<h2>Edit game</h2>
    <label>Name</label><input id="eg_name" maxlength="40" value="${esc(g.name)}">
    <label>Emoji</label><input id="eg_emoji" maxlength="4" value="${esc(g.emoji)}">
    <label class="inline"><input type="checkbox" id="eg_dbl" ${g.supports_doubles?'checked':''}> Can be played as doubles</label>
    <label class="inline"><input type="checkbox" id="eg_active" ${g.is_active?'checked':''}> Active (untick to hide from pickers)</label>
    <div class="error" id="eg_err"></div>
    <div class="row" style="margin-top:12px"><button class="btn" onclick="saveGame(this,'${id}')">Save</button><button class="btn ghost" onclick="closeModal()">Cancel</button></div>`);
};
window.saveGame = async (btn,id)=>{
  const err=document.getElementById('eg_err'); err.textContent='';
  setLoading(btn,true,'Saving...');
  const {error} = await sb.from('sttl2_games').update({
    name:document.getElementById('eg_name').value, emoji:document.getElementById('eg_emoji').value,
    supports_doubles:document.getElementById('eg_dbl').checked, is_active:document.getElementById('eg_active').checked}).eq('id',id);
  if(error){ setLoading(btn,false); err.textContent=error.message; return; }
  closeModal(); adminOpenSections.add('Games'); renderAdmin();
};
window.deleteGame = async (btn,id)=>{
  const g = adminGames.find(x=>x.id===id);
  if(!confirm(`Delete ${g?g.name:'this game'}? This only works if no matches were ever played in it (otherwise hide it instead). Ratings for it are removed.`)) return;
  setLoading(btn,true,'Deleting...');
  const {error} = await sb.from('sttl2_games').delete().eq('id',id);
  if(error){ setLoading(btn,false); alert(/foreign key|violates/i.test(error.message) ? 'This game has matches, so it cannot be deleted. Edit it and untick “Active” to hide it instead.' : error.message); return; }
  adminOpenSections.add('Games'); renderAdmin();
};

// ---------- password recovery (email link) ----------
let recovering = /type=recovery/.test(location.hash);
function renderRecovery(){
  recovering = true;
  app.innerHTML = `<div class="card" style="max-width:440px;margin:30px auto"><h2>Choose a new password</h2>
    <label>New password</label><input id="rc_pw" type="password" autocomplete="new-password">
    <div class="muted">Min 10 chars, 1 uppercase, 1 lowercase, 1 number, 1 special character.</div>
    <label>Confirm password</label><input id="rc_pw2" type="password" autocomplete="new-password">
    <div class="error" id="rc_err"></div>
    <button class="btn" id="rc_go" style="margin-top:12px">Save new password</button></div>`;
  document.getElementById('rc_go').onclick = async (e)=>{
    const btn=e.currentTarget, err=document.getElementById('rc_err');
    const pw=document.getElementById('rc_pw').value, pw2=document.getElementById('rc_pw2').value;
    err.style.color='var(--warn)';
    if(!pwOk(pw)){ err.textContent='Password does not meet the requirements.'; return; }
    if(pw!==pw2){ err.textContent='Passwords do not match.'; return; }
    setLoading(btn,true,'Saving...');
    const {error} = await sb.auth.updateUser({password:pw});
    if(error){ setLoading(btn,false); err.textContent=error.message; return; }
    recovering=false;
    try{ history.replaceState(null,'',location.pathname+location.search); }catch(_){}
    const {data:{session:s2}} = await sb.auth.getSession();
    if(s2){ session=s2; await loadMeAndBoot(); } else renderLogin();
  };
}
try{ sb.auth.onAuthStateChange((ev)=>{ if(ev==='PASSWORD_RECOVERY') renderRecovery(); }); }catch(_){}
// ---------- idle auto-logout (30 min without any activity) ----------
(function(){
  const LIMIT = 30*60*1000; let last = Date.now(), tick = null;
  const bump = ()=>{ last = Date.now(); };
  ['click','keydown','touchstart','mousemove','scroll'].forEach(ev=>window.addEventListener(ev,bump,{passive:true}));
  tick = setInterval(async ()=>{
    if(!session || recovering) return;
    if(Date.now()-last > LIMIT){
      clearInterval(tick);
      try{ await sb.auth.signOut(); }catch(_){}
      alert('You were logged out after 30 minutes without activity.');
      location.reload();
    }
  }, 30000);
})();
// ---------- INIT ----------
(async ()=>{
  if(SETUP_NEEDED){
    document.getElementById('app').innerHTML = `<div class="card" style="max-width:560px;margin:30px auto"><h2>STTL2 setup needed</h2>
      <p>STTL2 uses its <b>own</b> Supabase project, completely separate from STTL.</p>
      <ol><li>Create a new project at supabase.com.</li>
      <li>SQL editor → run <b>sttl2_schema.sql</b>.</li>
      <li>Project Settings → API → copy the <b>Project URL</b> and the <b>anon public</b> key into the two constants at the top of this file's script (<code>SUPABASE_URL</code>, <code>SUPABASE_ANON_KEY</code>).</li></ol></div>`;
    return;
  }
  try{ await loadConfig(); }catch(e){}
  try{ await loadGames(); }catch(e){}
  const {data:{session:s}} = await sb.auth.getSession();
  if(recovering){ renderRecovery(); return; }
  if(s){ session=s; await loadMeAndBoot(); } else { renderLogin(); }
})();
</script>
